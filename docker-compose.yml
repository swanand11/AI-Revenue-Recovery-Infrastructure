services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: revtrace-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; do sleep 2; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic authorization.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic capture.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic settlement.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic detection.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recovery.events --partitions 3 --replication-factor 1

  checkout-service:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./services/checkout/Dockerfile
    environment:
      - SERVICE_NAME=checkout-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-service:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./services/payment/Dockerfile
    environment:
      - SERVICE_NAME=payment-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  authorization-service:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./services/authorization/Dockerfile
    environment:
      - SERVICE_NAME=authorization-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  capture-service:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./services/capture/Dockerfile
    environment:
      - SERVICE_NAME=capture-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  settlement-service:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./services/settlement/Dockerfile
    environment:
      - SERVICE_NAME=settlement-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mock-pipeline:
    build:
      context: .
      dockerfile: ./runner/Dockerfile
    command: ["python", "-u", "runner/mock_pipeline.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WAL_PATH: /app/wal/events.jsonl
      MOCK_SCENARIO: ${MOCK_SCENARIO:-normal}
      MOCK_SEED: ${MOCK_SEED:-753251}
      MOCK_TRANSACTION_ID: ${MOCK_TRANSACTION_ID:-}
      MOCK_INTERVAL_SECONDS: ${MOCK_INTERVAL_SECONDS:-5}
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  detection-service:
    build:
      context: .
      dockerfile: ./detection/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingestion-bridge:
    build:
      context: .
      dockerfile: ./runner/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGESTION_STORE_NAME: ingestion_events
      INGESTION_STORE_LIMIT: "200"
    volumes:
      - dashboard_data:/app/runner/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  splunk:
    image: splunk/splunk:latest
    container_name: revtrace-splunk
    ports:
      - "8000:8000"
      - "8088:8088"
      - "8089:8089"
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-Changeme123!}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-revtrace-hec-token}
      SPLUNK_HEC_ENABLE: "1"
      SPLUNK_HEC_PORT: "8088"
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8089/services/server/info -u admin:${SPLUNK_PASSWORD:-Changeme123!} >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s

  splunk-forwarder:
    build:
      context: .
      dockerfile: ./consumers/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      splunk:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPLUNK_HEC_URL: https://splunk:8088
      SPLUNK_HEC_VERIFY_CERT: "false"
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-revtrace-hec-token}
      SPLUNK_INDEX: revtrace
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
      DASHBOARD_DATA_DIR: /app/runner/data
      SPLUNK_REST_URL: https://splunk:8089
      SPLUNK_VERIFY_TLS: "false"
      SPLUNK_USERNAME: admin
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-Changeme123!}
      SPLUNK_INDEX: revtrace
    ports:
      - "8080:8080"
    volumes:
      - dashboard_data:/app/runner/data
    depends_on:
      splunk:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka_data:
  wal_data:
  splunk_etc:
  splunk_var:
  dashboard_data:
