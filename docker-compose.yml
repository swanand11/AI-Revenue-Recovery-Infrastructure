services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: revtrace-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; do sleep 2; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic authorization.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic capture.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic settlement.events --partitions 3 --replication-factor 1

  checkout-service:
    build:
      context: .
      dockerfile: ./services/checkout/Dockerfile
    environment:
      - SERVICE_NAME=checkout-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: ./services/payment/Dockerfile
    environment:
      - SERVICE_NAME=payment-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  authorization-service:
    build:
      context: .
      dockerfile: ./services/authorization/Dockerfile
    environment:
      - SERVICE_NAME=authorization-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  capture-service:
    build:
      context: .
      dockerfile: ./services/capture/Dockerfile
    environment:
      - SERVICE_NAME=capture-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  settlement-service:
    build:
      context: .
      dockerfile: ./services/settlement/Dockerfile
    environment:
      - SERVICE_NAME=settlement-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WAL_PATH=/app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dummy-consumer:
    build:
      context: .
      dockerfile: ./consumers/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WAL_PATH: /app/wal/events.jsonl
    volumes:
      - wal_data:/app/wal
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka_data:
  wal_data:
