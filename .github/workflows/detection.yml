name: Detection Layer Verification

on:
  push:
    branches:
      - feat/detection-layer
  pull_request:
    branches:
      - feat/detection-layer

concurrency:
  group: detection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  detection-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run detection contract tests
        run: python -m pytest -q detection/tests

      - name: Run repo smoke test
        run: python smoke_test.py

      - name: Run repo validation
        run: python smoke_validation.py

